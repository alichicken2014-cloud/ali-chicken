<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿力香雞排 - 廚房即時出餐看板</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      margin: 0;
      padding: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2d2d2d;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .header h1 { margin: 0; font-size: 24px; color: #f39c12; }
    .status-tag { font-size: 14px; color: #a0a0a0; }
    .refresh-btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }
    .order-card {
      background: #2b2b2b;
      border: 2px solid #444;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3d3d3d;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .order-no { font-size: 26px; font-weight: bold; color: #f1c40f; }
    .order-time { font-size: 14px; color: #bbb; }
    .order-cust { font-size: 15px; color: #ddd; margin-bottom: 8px; font-weight: bold; }
    .order-items {
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-line;
      background: #222;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 10px;
      flex-grow: 1;
    }
    .order-remark {
      background: #c0392b;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .btn-finish {
      width: 100%;
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-finish:active { background: #1e8449; }
  </style>
</head>
<body>

<div class="header">
  <h1>🍳 阿力香雞排 - 廚房出餐看板</h1>
  <div>
    <span class="status-tag" id="lastUpdated">載入中...</span>
    <button class="refresh-btn" onclick="fetchOrders()">🔄 手動重新整理</button>
  </div>
</div>

<div class="grid-container" id="ordersGrid">
  <div style="grid-column: 1 / -1; text-align: center; color: #aaa; padding: 50px; font-size: 18px;">
    正在讀取未完成訂單...
  </div>
</div>

<script>
  // 已帶入您最新部署的網址
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4VN5yr5ZKfD0ko08e3IE7rJLcf1HjSzzWOnxEOKY8DXcO2qeaiSQfCtDj165XhMKgjw/exec";

  function fetchOrders() {
    document.getElementById('lastUpdated').innerText = '資料更新中...';
    
    fetch(GAS_WEB_APP_URL + "?action=getKitchenData")
      .then(res => res.json())
      .then(data => {
        const now = new Date();
        document.getElementById('lastUpdated').innerText = '最後更新：' + now.toLocaleTimeString();

        if (data.success && data.orders) {
          renderOrders(data.orders);
        } else {
          document.getElementById('ordersGrid').innerHTML = '<div style="grid-column: 1 / -1; text-align:center; color:#e74c3c;">讀取訂單失敗</div>';
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('lastUpdated').innerText = '更新失敗';
      });
  }

  function renderOrders(orders) {
    const grid = document.getElementById('ordersGrid');
    if (orders.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; color:#888; padding:50px; font-size:20px;">🎉 目前沒有待製作的單，休息一下吧！</div>';
      return;
    }

    let html = '';
    orders.forEach(order => {
      html += `
        <div class="order-card">
          <div>
            <div class="order-header">
              <span class="order-no">#${order.orderNo}</span>
              <span class="order-time">🕒 ${order.time}</span>
            </div>
            <div class="order-cust">👤 ${order.name} (${order.phone})</div>
            ${order.remark ? `<div class="order-remark">📝 備註：${order.remark}</div>` : ''}
            <div class="order-items">${order.itemsDetail}</div>
          </div>
          <button class="btn-finish" onclick="completeOrder(${order.rowIndex}, this)">✅ 出餐完成</button>
        </div>
      `;
    });
    grid.innerHTML = html;
  }

  function completeOrder(rowIndex, btnEl) {
    if (!confirm('確定此單已製作完成並出餐？')) return;
    
    btnEl.disabled = true;
    btnEl.innerText = '處理中...';

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'updateOrderStatus',
        rowIndex: rowIndex,
        status: '已完成'
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        fetchOrders(); // 重新整理
      } else {
        alert('修改狀態失敗：' + res.error);
        btnEl.disabled = false;
        btnEl.innerText = '✅ 出餐完成';
      }
    })
    .catch(err => {
      alert('連線失敗，請重試');
      btnEl.disabled = false;
      btnEl.innerText = '✅ 出餐完成';
    });
  }

  // 初次載入
  fetchOrders();

  // 每 15 秒自動輪詢更新一次
  setInterval(fetchOrders, 15000);
</script>

</body>
</html>
