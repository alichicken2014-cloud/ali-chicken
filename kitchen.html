<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿力香雞排 崑山店 - 廚房與菜單管理系統</title>
  
  <!-- 更換為穩定版 GBK 編碼庫 -->
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
  <!-- 引入 POS 熱感應機專用 GBK 轉碼庫 -->
<script src="https://cdn.jsdelivr.net/npm/iconv-lite-umd@0.6.8/lib/iconv-lite-umd.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
    body { background-color: #1e1e2f; color: #ffffff; margin: 0; padding: 15px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #27293d; padding: 12px 20px; border-radius: 10px; margin-bottom: 12px; }
    .top-bar h1 { margin: 0; font-size: 20px; color: #ff8c00; }
    
    .status-group { display: flex; gap: 8px; align-items: center; }
    .status-btn { padding: 8px 16px; border: none; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; color: white; }
    .status-open { background-color: #28a745; }
    .status-closed { background-color: #dc3545; }
    .status-auto { background-color: #17a2b8; }

    .tool-bar { display: flex; gap: 10px; align-items: center; background: #27293d; padding: 10px 20px; border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .tool-btn { padding: 8px 14px; border: 1px solid #444; background: #3a3b5a; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .tool-btn:hover { background: #4e5077; }
    .printer-status { font-size: 14px; font-weight: bold; color: #ff4757; }
    .printer-status.connected { color: #2ed573; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .nav-tab { padding: 10px 20px; background: #27293d; border: 1px solid #3f4260; color: #aaa; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .nav-tab.active { background: #ff8c00; color: white; border-color: #ff8c00; }

    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .order-card { background: #27293d; border-radius: 10px; padding: 15px; border-left: 6px solid #ff8c00; position: relative; }
    
    .order-header { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; border-bottom: 1px solid #3f4260; padding-bottom: 8px; margin-bottom: 8px; }
    .order-info { font-size: 14px; color: #bbb; margin-bottom: 8px; }
    .items-box { background: #1e1e2f; padding: 10px; border-radius: 6px; font-size: 16px; font-weight: bold; color: #00ffcc; white-space: pre-wrap; margin-bottom: 10px; }
    .order-actions { display: flex; gap: 8px; }
    .action-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
    .btn-print { background: #17a2b8; }
    .btn-finish { background: #28a745; }

    .menu-mgmt-table { width: 100%; border-collapse: collapse; background: #27293d; border-radius: 10px; overflow: hidden; }
    .menu-mgmt-table th, .menu-mgmt-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #3f4260; }
    .menu-mgmt-table th { background: #1e1e2f; color: #ff8c00; font-size: 16px; }
    
    .toggle-stock-btn { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
    .stock-in { background-color: #28a745; }
    .stock-out { background-color: #dc3545; }

    .price-input { width: 70px; padding: 6px; border: 1px solid #444; background: #1e1e2f; color: white; border-radius: 4px; text-align: center; font-size: 15px; }

    .announcement-card { background: #27293d; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #ff8c00; }
    .form-control { width: 100%; padding: 10px; background: #1e1e2f; border: 1px solid #3f4260; color: white; border-radius: 6px; font-size: 15px; }
    .form-control:focus { border-color: #ff8c00; outline: none; }
    .date-range-group { display: flex; gap: 10px; align-items: center; }
    .btn-save-announcement { width: 100%; padding: 12px; background: #ff8c00; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>🍳 阿力香雞排 崑山店 - 廚房系統</h1>
  <div class="status-group">
    <button id="store-status-btn" class="status-btn status-open" onclick="toggleStoreStatus()">讀取中...</button>
    <button id="reset-auto-btn" class="status-btn status-auto" onclick="resetToAuto()" style="display:none;">🔄 恢復自動排程</button>
  </div>
</div>

<div class="tool-bar">
  <button class="tool-btn" onclick="connectBluetoothPrinter()">🖨️ 連接藍牙出單機</button>
  <span id="printer-status-text" class="printer-status">未連線</span>
  <button class="tool-btn" onclick="speakText('語音測試正常')">🔊 語音測試</button>
</div>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="switchView('orders')">📋 即時訂單看板</div>
  <div class="nav-tab" onclick="switchView('menu')">🍱 菜單上下架 / 價格修改</div>
  <div class="nav-tab" onclick="switchView('announcement')">📣 店休 / 公告設定</div>
</div>

<div id="orders-view">
  <div class="orders-grid" id="orders-container">
    <div style="color: #888;">正在載入最新訂單...</div>
  </div>
</div>

<div id="menu-view" style="display: none;">
  <table class="menu-mgmt-table">
    <thead>
      <tr>
        <th>分類</th>
        <th>品名 (份量)</th>
        <th>單價 ($)</th>
        <th>目前狀態</th>
        <th>操作 / 切換</th>
      </tr>
    </thead>
    <tbody id="menu-mgmt-body">
      <tr><td colspan="5">正在載入菜單...</td></tr>
    </tbody>
  </table>
</div>

<div id="announcement-view" style="display: none;">
  <div class="announcement-card">
    <h2 style="margin-top:0; color:#ff8c00;">📣 顧客端公告 Banner 設定</h2>
    <div class="form-group">
      <label for="announcement-type">公告類型</label>
      <select id="announcement-type" class="form-control" onchange="toggleAnnouncementFields()">
        <option value="none">正常營業（無公告）</option>
        <option value="single">臨時店休公告</option>
        <option value="vacation">長假/連假公休公告</option>
      </select>
    </div>

    <div id="vacation-dates-group" class="form-group" style="display: none;">
      <label>長假起訖日期</label>
      <div class="date-range-group">
        <input type="date" id="vacation-start" class="form-control">
        <span>至</span>
        <input type="date" id="vacation-end" class="form-control">
      </div>
    </div>

    <div class="form-group">
      <label for="announcement-msg">公告內容 / 原因說明</label>
      <textarea id="announcement-msg" class="form-control" rows="3" placeholder="例如：設備維修臨時公休一日 / 春節連假公休，祝大家新年快樂！"></textarea>
    </div>

    <button class="btn-save-announcement" onclick="saveAnnouncement()">💾 儲存並同步至點餐系統</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzMymZbWTF0FlAQKB2FtLQ5SNnG7-4dRlEklVnMN-pZ4wNzXUYaUJAXOknoWtccrk5Ebg/exec";

  let isOpenState = true;
  let manualOverride = "auto";
  let menuList = [];
  let existingOrderIds = new Set();
  let bluetoothDevice = null;
  let printCharacteristic = null;
  let isFirstLoad = true;

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  async function connectBluetoothPrinter() {
    try {
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
      });

      const server = await bluetoothDevice.gatt.connect();
      const services = await server.getPrimaryServices();
      
      for (const service of services) {
        const characteristics = await service.getCharacteristics();
        for (const c of characteristics) {
          if (c.properties.write || c.properties.writeWithoutResponse) {
            printCharacteristic = c;
            break;
          }
        }
        if (printCharacteristic) break;
      }

      if (printCharacteristic) {
        const statusText = document.getElementById("printer-status-text");
        statusText.innerText = "🟢 已連線：" + bluetoothDevice.name;
        statusText.className = "printer-status connected";
        speakText("藍牙出單機連線成功");
      }
    } catch (err) {
      alert("⚠️ 藍牙連線失敗：" + err.message);
    }
  }
// 💡 徹底解決亂碼與多餘空白的終極列印函式
async function printOrder(o) {
  if (!printCharacteristic) {
    alert("⚠️ 請先連接藍芽出單機！");
    return;
  }

  try {
    const orderId = o.orderId || o.orderNo || "#000";
    const orderTime = o.orderTime || o.time || "";
    const name = o.name || "顧客";
    const phone = o.phone || "";
    const itemsDetail = o.itemsDetail || "";
    const remark = o.remark || "";
    const totalPrice = o.totalPrice || 0;

    // 排版設定（緊湊省紙）
    let txt = `========================\n`;
    txt += `  阿力香雞排 崑山店 點餐單  \n`;
    txt += `========================\n`;
    txt += `單號：${orderId}\n`;
    txt += `時間：${orderTime}\n`;
    txt += `姓名：${name}\n`;
    txt += `電話：${phone}\n`;
    txt += `------------------------\n`;
    txt += `${itemsDetail}\n`;
    txt += `------------------------\n`;
    if (remark && remark !== "無") {
      txt += `備註：${remark}\n`;
    }
    txt += `總金額：$${totalPrice} 元\n`;
    txt += `========================\n\n`;

    // 使用 iconv-lite 將 Unicode 繁簡中文轉換為 GBK
    let uint8array;
    if (window.iconv) {
      uint8array = window.iconv.encode(txt, 'gbk');
    } else {
      // 備用方案
      uint8array = new TextEncoder().encode(txt);
    }

    // 發送 ESC/POS 熱感應出單機指令
    // 1. 初始化印表機 (ESC @)
    await printCharacteristic.writeValue(new Uint8Array([0x1B, 0x40]));
    
    // 2. 切換至中文模式 (FS &)
    await printCharacteristic.writeValue(new Uint8Array([0x1C, 0x26]));

    // 3. 切片發送資料 (每區塊 64 bytes 避免硬體 Buffer 溢位)
    const chunkSize = 64;
    for (let i = 0; i < uint8array.length; i += chunkSize) {
      const chunk = uint8array.slice(i, i + chunkSize);
      await printCharacteristic.writeValue(chunk);
      await new Promise(resolve => setTimeout(resolve, 30));
    }

    // 4. 進紙與半切 (ESC d 2 走紙2行 + GS V 1 切紙)
    await printCharacteristic.writeValue(new Uint8Array([0x1B, 0x64, 0x02]));
    await printCharacteristic.writeValue(new Uint8Array([0x1D, 0x56, 0x01]));

  } catch (err) {
    console.error("列印失敗:", err);
    alert("⚠️ 出單機列印失敗：" + err.message);
  }
}

// 💡 內建跨平台 UTF-8 轉 GBK 支援函式
function stringToGBKUint8Array(str) {
  if (typeof Encoding !== "undefined" && Encoding.convert) {
    const unicodeArray = Encoding.stringToCode(str);
    const gbkArray = Encoding.convert(unicodeArray, { to: 'GBK', from: 'UNICODE' });
    return new Uint8Array(gbkArray);
  }
  
  // 備用相容性轉碼
  const bytes = [];
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i);
    if (code < 0x80) {
      bytes.push(code);
    } else {
      // 若無轉碼庫，進行相容點陣降級
      const encoded = encodeURIComponent(str.charAt(i)).replace(/%/g, '');
      for (let j = 0; j < encoded.length; j += 2) {
        bytes.push(parseInt(encoded.substr(j, 2), 16));
      }
    }
  }
  return new Uint8Array(bytes);
}
  async function fetchKitchenData() {
    try {
      const response = await fetch(`${GAS_URL}?action=getKitchenOrders`, {
        method: 'GET',
        redirect: 'follow'
      });

      if (!response.ok) {
        throw new Error(`HTTP 錯誤: ${response.status}`);
      }

      const data = await response.json();
      
      isOpenState = data.isOpen;
      manualOverride = data.manualOverride || "auto";
      updateStatusUI(isOpenState, manualOverride);
      
      const orders = data.orders || [];
      
      if (!isFirstLoad) {
        orders.forEach(order => {
          if (!existingOrderIds.has(order.orderId)) {
            const cleanOrderId = order.orderId.replace('#', '');
            speakText(`你有新訂單！訂單編號 ${cleanOrderId}`);
            if (printCharacteristic) printOrder(order);
          }
        });
      }

      if (isFirstLoad && data.announcement) {
        renderAnnouncementUI(data.announcement);
      }

      existingOrderIds = new Set(orders.map(o => o.orderId));
      isFirstLoad = false;

      renderOrders(orders);
      if (data.menu) {
        menuList = data.menu;
        renderMenuMgmt();
      }
    } catch (err) {
      console.error("載入失敗詳情:", err);
      const container = document.getElementById("orders-container");
      container.innerHTML = `<div style='color:#dc3545; font-size:16px;'>⚠️ 資料載入失敗：${err.message}</div>`;
    }
  }

  function renderOrders(orders) {
    const container = document.getElementById("orders-container");
    container.innerHTML = "";

    if (orders.length === 0) {
      container.innerHTML = "<div style='color:#888; font-size:18px;'>目前沒有待處理訂單 ☕</div>";
      return;
    }

    orders.forEach(order => {
      const card = document.createElement("div");
      card.className = "order-card";
      card.innerHTML = `
        <div class="order-header">
          <span>${order.orderId} - ${order.name}</span>
          <span>$${order.totalPrice}</span>
        </div>
        <div class="order-info">⏰ 時間：${order.orderTime} | 📞 電話：${order.phone}</div>
        <div class="items-box">${order.itemsDetail}</div>
        ${order.remark ? `<div class="order-info" style="color:#ff4757;">📝 備註：${order.remark}</div>` : ''}
        <div class="order-actions">
          <button class="action-btn btn-print" onclick='printOrder(${JSON.stringify(order)})'>🖨️ 補印單據</button>
          <button class="action-btn btn-finish" onclick="updateOrderStatus(${order.row}, '已完成')">✅ 完成出餐</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function renderMenuMgmt() {
    const tbody = document.getElementById("menu-mgmt-body");
    tbody.innerHTML = "";

    menuList.forEach(item => {
      const isAvailable = (item.status === "有貨");
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td><b style="color:#ff8c00;">${item.category}</b></td>
        <td><b>${item.name}</b></td>
        <td>
          <input type="number" class="price-input" value="${item.price}" onchange="updatePrice(${item.rowIndex}, this.value)">
        </td>
        <td>
          <span style="color: ${isAvailable ? '#28a745' : '#dc3545'}; font-weight:bold;">
            ${isAvailable ? '🟢 有貨供應' : '🔴 售完停售'}
          </span>
        </td>
        <td>
          <button class="toggle-stock-btn ${isAvailable ? 'stock-out' : 'stock-in'}" 
                  onclick="toggleItemStock(${item.rowIndex}, '${isAvailable ? '售完' : '有貨'}')">
            ${isAvailable ? '設為售完' : '恢復有貨'}
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 💡 補齊缺少的公告渲染與控制函式
  function toggleAnnouncementFields() {
    const type = document.getElementById('announcement-type').value;
    document.getElementById('vacation-dates-group').style.display = (type === 'vacation') ? 'block' : 'none';
  }

  function renderAnnouncementUI(ann) {
    if (!ann) return;
    document.getElementById('announcement-type').value = ann.type || 'none';
    document.getElementById('announcement-msg').value = ann.message || '';
    document.getElementById('vacation-start').value = ann.startDate || '';
    document.getElementById('vacation-end').value = ann.endDate || '';
    toggleAnnouncementFields();
  }

  async function saveAnnouncement() {
    const type = document.getElementById('announcement-type').value;
    const message = document.getElementById('announcement-msg').value;
    const startDate = document.getElementById('vacation-start').value;
    const endDate = document.getElementById('vacation-end').value;

    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: "updateAnnouncement",
          announcement: { type, message, startDate, endDate }
        })
      });
      alert("📢 公告設定儲存成功！");
    } catch (err) {
      alert("⚠️ 公告儲存失敗！");
    }
  }

  async function toggleStoreStatus() {
    const nextStatus = !isOpenState;
    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "toggleStatus", status: nextStatus })
      });
      isOpenState = nextStatus;
      manualOverride = String(nextStatus);
      updateStatusUI(isOpenState, manualOverride);
    } catch (err) {
      alert("⚠️ 切換失敗！");
    }
  }

  async function resetToAuto() {
    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "toggleStatus", status: "auto" })
      });
      fetchKitchenData();
    } catch (err) {
      alert("⚠️ 恢復失敗！");
    }
  }

  function updateStatusUI(isOpen, override) {
    const btn = document.getElementById("store-status-btn");
    const autoBtn = document.getElementById("reset-auto-btn");

    if (override === "true" || override === "false") {
      autoBtn.style.display = "inline-block";
      if (isOpen) {
        btn.innerText = "⚡ 強制營業中 (手動設定)";
        btn.className = "status-btn status-open";
      } else {
        btn.innerText = "🛑 強制打烊中 (手動設定)";
        btn.className = "status-btn status-closed";
      }
    } else {
      autoBtn.style.display = "none";
      if (isOpen) {
        btn.innerText = "🟢 自動營業中 (15:00-23:00)";
        btn.className = "status-btn status-open";
      } else {
        btn.innerText = "🔴 自動打烊/公休中";
        btn.className = "status-btn status-closed";
      }
    }
  }

  async function toggleItemStock(rowIndex, newStatus) {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: "updateItemStatus", rowIndex: rowIndex, status: newStatus })
    });
    fetchKitchenData();
  }

  async function updatePrice(rowIndex, newPrice) {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: "updateItemPrice", rowIndex: rowIndex, price: newPrice })
    });
    fetchKitchenData();
  }

  async function updateOrderStatus(row, status) {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: "updateOrderStatus", row: row, status: status })
    });
    fetchKitchenData();
  }

  function switchView(viewName) {
    document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
    document.getElementById('orders-view').style.display = 'none';
    document.getElementById('menu-view').style.display = 'none';
    document.getElementById('announcement-view').style.display = 'none';

    if (viewName === 'orders') {
      document.querySelectorAll('.nav-tab')[0].classList.add('active');
      document.getElementById('orders-view').style.display = 'block';
    } else if (viewName === 'menu') {
      document.querySelectorAll('.nav-tab')[1].classList.add('active');
      document.getElementById('menu-view').style.display = 'block';
    } else if (viewName === 'announcement') {
      document.querySelectorAll('.nav-tab')[2].classList.add('active');
      document.getElementById('announcement-view').style.display = 'block';
    }
  }

  fetchKitchenData();
  setInterval(fetchKitchenData, 10000);
</script>

</body>
</html>
