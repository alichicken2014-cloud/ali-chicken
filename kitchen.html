<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿力香雞排 - 廚房出單看板</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .header h2 { margin: 0; font-size: 22px; color: #333; }
    .status-btn { padding: 10px 18px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .open { background-color: #28a745; color: white; }
    .closed { background-color: #dc3545; color: white; }
    
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: white; border-radius: 8px; border-top: 6px solid #007bff; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: bold; color: #111; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-bottom: 10px; }
    .card-header .time { font-size: 14px; color: #666; font-weight: normal; }
    .card-body { font-size: 16px; color: #444; line-height: 1.5; margin-bottom: 15px; white-space: pre-line; }
    .card-body strong { color: #000; }
    .card-footer { display: flex; gap: 8px; }
    
    .btn { flex: 1; padding: 10px 0; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; }
    .btn-print { background: #ffc107; color: #212529; }
    .btn-done { background: #28a745; color: white; }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>

<div class="header">
  <h2>阿力香雞排 - 廚房看板</h2>
  <div>
    <button id="toggle-status-btn" class="status-btn open" onclick="toggleStatus()">載入中...</button>
  </div>
</div>

<div class="card-grid" id="orders-container">
  <!-- 動態渲染訂單卡片 -->
</div>

<script>
  // 🌟 請替換為您部署 Apps Script 後取得的 Web App URL
  const GAS_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"; 
  
  let knownOrderNos = new Set();
  let currentIsOpen = true;
  
  // 隊列控制變數
  let printQueue = [];
  let isPrinting = false;

  // 1. 語音播報功能
  function speakAlert(text) {
    if ('speechSynthesis' in window) {
      const synth = window.speechSynthesis;
      const utterThis = new SpeechSynthesisUtterance(text);
      utterThis.lang = 'zh-TW';
      synth.speak(utterThis);
    }
  }

  // 2. RawBT 靜默列印文字傳送
  function sendToRawBT(order) {
    // 組合熱感應出貨單文字格式
    const textToPrint = 
`==============================
【阿力香雞排 - 出貨單】
單號：#${order.orderNo}
時間：${order.orderTime}
姓名：${order.name}
電話：${order.phone}
------------------------------
餐點明細：
${order.itemsDetail}
------------------------------
備註：${order.remark || '無'}
金額：$${order.totalPrice} 元
==============================


`; // 尾端空行方便出單機切紙/留白

    // 將內容編碼成 Base64 並透過 RawBT 協議發送
    const rawbtUrl = "rawbt:base64," + btoa(unescape(encodeURIComponent(textToPrint)));
    
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    iframe.src = rawbtUrl;
    document.body.appendChild(iframe);
    
    setTimeout(() => {
      document.body.removeChild(iframe);
    }, 1500);
  }

  // 3. 列印隊列處理 (避免連續進單時藍牙傳輸衝突)
  function queuePrint(order) {
    printQueue.push(order);
    processQueue();
  }

  function processQueue() {
    if (isPrinting || printQueue.length === 0) return;

    isPrinting = true;
    const order = printQueue.shift();

    sendToRawBT(order);

    // 預留 2.5 秒緩衝時間，等 mrboss 印完後再處理下一張
    setTimeout(() => {
      isPrinting = false;
      processQueue();
    }, 2500);
  }

  // 4. 從 Google Apps Script 獲取廚房最新訂單
  async function fetchOrders() {
    try {
      const res = await fetch(`${GAS_URL}?action=getKitchenOrders`);
      const data = await res.json();
      
      if (data.success) {
        updateStatusUI(data.isOpen);
        renderOrders(data.orders);
      }
    } catch (err) {
      console.error("抓取訂單失敗", err);
    }
  }

  // 5. 渲染廚房看板畫面
  function renderOrders(orders) {
    const container = document.getElementById("orders-container");
    container.innerHTML = "";

    orders.forEach(order => {
      // 判斷是否為新訂單 (新訂單進來時觸發語音與自動列印)
      if (!knownOrderNos.has(order.orderNo)) {
        knownOrderNos.add(order.orderNo);
        speakAlert("你有新訂單");
        queuePrint(order); // 加入自動列印隊列
      }

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <div class="card-header">
            <span>#${order.orderNo}</span>
            <span class="time">${order.orderTime}</span>
          </div>
          <div class="card-body">
            <strong>顧客：</strong>${order.name} (${order.phone})<br>
            <strong>明細：</strong><br>${order.itemsDetail}<br>
            <strong>備註：</strong>${order.remark || '無'}<br>
            <strong>金額：</strong>$${order.totalPrice}
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-print" onclick='queuePrint(${JSON.stringify(order)})'>補單列印</button>
          <button class="btn btn-done" onclick="completeOrder(${order.row})">完成</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 6. 點擊「完成」移除訂單並更新 Google Sheet 狀態
  async function completeOrder(row) {
    try {
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateOrderStatus", row: row, status: "已完成" })
      });
      fetchOrders();
    } catch (err) {
      alert("更新狀態失敗，請重試");
    }
  }

  // 7. 切換營業 / 臨時公休狀態
  async function toggleStatus() {
    const nextStatus = !currentIsOpen;
    try {
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleStatus", status: nextStatus })
      });
      fetchOrders();
    } catch (err) {
      alert("切換狀態失敗");
    }
  }

  function updateStatusUI(isOpen) {
    currentIsOpen = isOpen;
    const btn = document.getElementById("toggle-status-btn");
    if (isOpen) {
      btn.className = "status-btn open";
      btn.innerText = "營業中 (點擊改公休)";
    } else {
      btn.className = "status-btn closed";
      btn.innerText = "臨時公休中 (點擊開啟)";
    }
  }

  // 8. 輪詢機制：每 6 秒自動重新向試算表請求一次資料
  setInterval(fetchOrders, 6000);
  fetchOrders();
</script>

</body>
</html>
