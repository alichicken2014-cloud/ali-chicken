<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿力香雞排 崑山店 - 廚房出單看板</title>
  <!-- 引入轉圖庫 html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
    
    /* 頂部看板列 */
    .header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header h2 { margin: 0; font-size: 22px; color: #333; }
    .btn-group { display: flex; gap: 10px; }
    .status-btn { padding: 10px 18px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .bt-btn { background-color: #007bff; color: white; }
    .open { background-color: #28a745; color: white; }
    .closed { background-color: #dc3545; color: white; }
    
    /* 看板卡片網格 */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    .card { background: white; border-radius: 8px; border-top: 6px solid #d35400; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: bold; color: #d35400; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-bottom: 10px; }
    .card-header .time { font-size: 14px; color: #666; font-weight: normal; }
    .card-body { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 15px; }
    
    .flavor-box { background: #fff8e7; border: 2px solid #f39c12; padding: 8px 10px; border-radius: 6px; margin: 8px 0; font-size: 18px; color: #d35400; font-weight: bold; }
    .items-box { background: #fafafa; border-left: 4px solid #f39c12; padding: 8px; margin: 8px 0; font-size: 16px; white-space: pre-line; font-weight: 500; }
    
    .card-footer { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px 0; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; }
    .btn-print { background: #ffc107; color: #212529; }
    .btn-done { background: #28a745; color: white; }
    
    /* 隱藏的列印畫布：專門渲染要列印的小票模板 */
    #print-ticket-template {
      position: absolute; left: -9999px; top: -9999px;
      width: 384px; /* 58mm 熱感應紙標準寬度 */
      background: #ffffff;
      color: #000000;
      font-family: "MingLiU", "PMingLiU", "新細明體", serif;
      padding: 5px;
      box-sizing: border-box;
    }
    .ticket-title { text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
    .ticket-num { text-align: center; font-size: 42px; font-weight: 900; border-top: 3px dashed #000; border-bottom: 3px dashed #000; padding: 5px 0; margin: 5px 0; }
    .ticket-info { font-size: 20px; font-weight: bold; margin: 4px 0; }
    
    /* 中間調味區段 */
    .ticket-highlight { border: 3px solid #000; padding: 8px; margin: 10px 0; font-size: 32px; font-weight: 900; background-color: #ffffff; line-height: 1.3; }
    
    /* 中間餐點內容標題與明細 */
    .ticket-items-title { font-size: 24px; font-weight: 900; margin-top: 10px; text-decoration: underline; }
    .ticket-items { font-size: 34px; font-weight: 900; line-height: 1.4; margin: 8px 0; white-space: pre-line; word-break: break-all; }
    
    .ticket-divider { border-top: 2px dashed #000; margin: 10px 0; }
  </style>
</head>
<body>

<div class="header">
  <h2>🐥 阿力香雞排-崑山店 (廚房看板)</h2>
  <div class="btn-group">
    <button id="connect-bt-btn" class="status-btn bt-btn" onclick="connectBluetooth()">🔵 連接出單機</button>
    <button id="toggle-status-btn" class="status-btn open" onclick="toggleStatus()">載入中...</button>
  </div>
</div>

<!-- 訂單卡片網格區域 -->
<div class="card-grid" id="orders-container"></div>

<!-- 隱藏的出單小票繪製容器 -->
<div id="print-ticket-template">
  <div class="ticket-title">🎉【阿力香雞排-崑山店】</div>
  <div class="ticket-num" id="p-order-id">取單號碼：#0</div>
  <div class="ticket-info" id="p-time">時間：--:--</div>
  <div class="ticket-info" id="p-name">👤 訂購人：--</div>
  <div class="ticket-info" id="p-phone">📞 電 話：--</div>
  
  <div class="ticket-highlight">
    <div>🌶️ 整包調味：<span id="p-spice">--</span></div>
    <div id="p-pref-box">🌿 特殊偏好：<span id="p-pref">--</span></div>
  </div>

  <div class="ticket-items-title">📋 訂餐內容：</div>
  <div class="ticket-items" id="p-items"></div>
  
  <div class="ticket-divider"></div>
  <div class="ticket-info" style="font-size: 24px;" id="p-note">📝 訂單備註：無</div>
  <div class="ticket-info" style="font-size: 26px; font-weight: 900; text-align: right; margin-top: 8px;" id="p-total">💰 總金額：$0</div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzMymZbWTF0FlAQKB2FtLQ5SNnG7-4dRlEklVnMN-pZ4wNzXUYaUJAXOknoWtccrk5Ebg/exec"; 
  
  let knownOrderNos = new Set();
  let currentIsOpen = true;
  let printQueue = [];
  let isPrinting = false;
  let printCharacteristic = null;

  // 🛠️ 電話號碼格式化函式 (自動轉為 0000-000-000 格式)
  function formatPhone(phone) {
    if (!phone) return '';
    let cleaned = ('' + phone).replace(/\D/g, ''); // 去除非數字字元
    
    // 如果是國際開頭 886，自動轉成 0
    if (cleaned.startsWith('886')) {
      cleaned = '0' + cleaned.substring(3);
    }
    // 如果輸入沒有補 0 (例如 917522271)，自動補 0 變成 0917522271
    if (cleaned.length === 9 && !cleaned.startsWith('0')) {
      cleaned = '0' + cleaned;
    }

    // 格式化為 0000-000-000
    if (cleaned.length === 10) {
      return cleaned.replace(/(\d{4})(\d{3})(\d{3})/, '$1-$2-$3');
    }
    
    return phone; // 不符合長度時保留原樣
  }

  // 1. Web Bluetooth 藍牙連線功能
  async function connectBluetooth() {
    try {
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', 4953]
      });

      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      
      for (const service of services) {
        const characteristics = await service.getCharacteristics();
        for (const c of characteristics) {
          if (c.properties.write || c.properties.writeWithoutResponse) {
            printCharacteristic = c;
            break;
          }
        }
        if (printCharacteristic) break;
      }

      if (printCharacteristic) {
        document.getElementById('connect-bt-btn').innerText = "🟢 出單機已連線";
        document.getElementById('connect-bt-btn').style.backgroundColor = "#28a745";
        alert("藍牙出單機連線成功！");
      } else {
        alert("已找到藍牙裝置，但未能找到可寫入的列印通道。");
      }
    } catch (err) {
      console.error("藍牙連線失敗:", err);
      alert("藍牙連線失敗或被取消: " + err.message);
    }
  }

  // 2. 語音播報功能
  function speakAlert(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterThis = new SpeechSynthesisUtterance(text);
      utterThis.lang = 'zh-TW';
      utterThis.rate = 1.1;
      window.speechSynthesis.speak(utterThis);
    }
  }

  // 3. 將 Canvas 圖片轉換為 ESC/POS Raster 指令流發送到藍牙
  async function sendToBluetoothPrinter(canvas) {
    if (!printCharacteristic) {
      console.warn("藍牙未連線，跳過自動列印");
      return;
    }

    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const imgData = ctx.getImageData(0, 0, width, height);
    
    let bytes = [0x1B, 0x40]; // 初始化

    const widthBytes = Math.ceil(width / 8);
    bytes.push(0x1D, 0x76, 0x30, 0, widthBytes % 256, Math.floor(widthBytes / 256), height % 256, Math.floor(height / 256));

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < widthBytes; x++) {
        let byteVal = 0;
        for (let b = 0; b < 8; b++) {
          const pixelX = x * 8 + b;
          if (pixelX < width) {
            const idx = (y * width + pixelX) * 4;
            const avg = (imgData.data[idx] + imgData.data[idx + 1] + imgData.data[idx + 2]) / 3;
            if (avg < 128) {
              byteVal |= (1 << (7 - b));
            }
          }
        }
        bytes.push(byteVal);
      }
    }

    // 進紙切紙
    bytes.push(0x1B, 0x64, 0x03);

    const chunkSize = 100;
    const dataUint8 = new Uint8Array(bytes);
    for (let i = 0; i < dataUint8.length; i += chunkSize) {
      const chunk = dataUint8.slice(i, i + chunkSize);
      await printCharacteristic.writeValue(chunk);
    }
  }

  // 4. 列印處理核心
  async function sendToRawBTGraphic(order) {
    try {
      const formattedPhone = formatPhone(order.phone);
      
      document.getElementById('p-order-id').innerText = "取單號碼：" + (order.orderId || order.orderNo || '#--');
      document.getElementById('p-time').innerText = "時間：" + (order.orderTime || '');
      document.getElementById('p-name').innerText = "👤 訂購人：" + (order.name || '');
      document.getElementById('p-phone').innerText = "📞 電 話：" + formattedPhone;
      document.getElementById('p-spice').innerText = order.spice || '胡椒';
      
      const pref = order.preference || '無';
      document.getElementById('p-pref').innerText = pref;
      
      document.getElementById('p-items').innerText = order.itemsDetail || order.items || '';
      document.getElementById('p-note').innerText = "📝 訂單備註：" + (order.remark || order.note || '無');
      document.getElementById('p-total').innerText = "💰 總金額：$" + (order.totalPrice || 0);

      const ticketElem = document.getElementById('print-ticket-template');

      const canvas = await html2canvas(ticketElem, {
        scale: 1,
        width: 384,
        backgroundColor: "#ffffff"
      });

      await sendToBluetoothPrinter(canvas);

    } catch (err) {
      console.error("列印失敗:", err);
    }
  }

  // 5. 列印隊列控制
  function queuePrint(order) {
    printQueue.push(order);
    processQueue();
  }

  function processQueue() {
    if (isPrinting || printQueue.length === 0) return;

    isPrinting = true;
    const order = printQueue.shift();

    sendToRawBTGraphic(order).then(() => {
      setTimeout(() => {
        isPrinting = false;
        processQueue();
      }, 3000);
    });
  }

  // 6. 從 GAS 獲取最新訂單
  async function fetchOrders() {
    try {
      const res = await fetch(`${GAS_URL}?action=getKitchenOrders`);
      const data = await res.json();
      
      if (data.isOpen !== undefined) {
        updateStatusUI(data.isOpen);
      }
      
      const orders = data.orders || (Array.isArray(data) ? data : []);
      renderOrders(orders);
    } catch (err) {
      console.error("讀取訂單失敗:", err);
    }
  }

  // 7. 繪製廚房看板卡片
  function renderOrders(orders) {
    const container = document.getElementById("orders-container");
    container.innerHTML = "";

    if (orders.length === 0) {
      container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#888; padding: 50px 0; font-size:18px;">🎉 目前沒有待製作訂單</div>';
      return;
    }

    orders.forEach(order => {
      const orderNo = order.orderId || order.orderNo;
      const formattedPhone = formatPhone(order.phone);

      if (orderNo && !knownOrderNos.has(orderNo)) {
        knownOrderNos.add(orderNo);
        speakAlert("你有新訂單");
        queuePrint(order);
      }

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <div class="card-header">
            <span>${orderNo}</span>
            <span class="time">${order.orderTime || ''}</span>
          </div>
          <div class="card-body">
            <div><strong>顧客：</strong>${order.name || '顧客'} (${formattedPhone})</div>
            
            <div class="flavor-box">
              🌶️ 整包調味：${order.spice || '胡椒'}<br>
              🌿 特殊偏好：${order.preference || '無'}
            </div>

            <div><strong>餐點明細：</strong></div>
            <div class="items-box">${order.itemsDetail || order.items || ''}</div>
            
            <div><strong>備註：</strong>${order.remark || order.note || '無'}</div>
            <div style="margin-top:8px; font-weight:bold; color:#e67e22; font-size:18px;">
              <strong>總金額：</strong>$${order.totalPrice || 0}
            </div>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-print" onclick='queuePrint(${JSON.stringify(order)})'>補單列印</button>
          <button class="btn btn-done" onclick="completeOrder(${order.row})">完成出單</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 8. 點擊「完成出單」
  async function completeOrder(row) {
    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "updateOrderStatus", row: row, status: "已完成" })
      });
      fetchOrders();
    } catch (err) {
      alert("更新失敗");
    }
  }

  // 9. 切換營業狀態
  async function toggleStatus() {
    const nextStatus = !currentIsOpen;
    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "toggleStatus", status: nextStatus })
      });
      fetchOrders();
    } catch (err) {
      alert("切換狀態失敗");
    }
  }

  function updateStatusUI(isOpen) {
    currentIsOpen = isOpen;
    const btn = document.getElementById("toggle-status-btn");
    if (isOpen) {
      btn.className = "status-btn open";
      btn.innerText = "🟢 營業中 (點擊改公休)";
    } else {
      btn.className = "status-btn closed";
      btn.innerText = "🔴 臨時公休中 (點擊開啟)";
    }
  }

  // 每 6 秒自動輪詢一次
  setInterval(fetchOrders, 6000);
  fetchOrders();
</script>

</body>
</html>
