<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿力香雞排 崑山店 - 線上點餐</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0; padding: 0;
      color: #333;
      padding-bottom: 100px;
    }
    .header {
      background: linear-gradient(135deg, #e67e22, #d35400);
      color: white; padding: 20px 15px; text-align: center;
      border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9; }

    /* 營業狀態提示條 */
    .status-banner {
      background-color: #e74c3c; color: white;
      text-align: center; padding: 12px 15px;
      font-size: 15px; font-weight: bold;
      display: none; border-radius: 8px; margin: 15px;
      box-shadow: 0 2px 6px rgba(231,76,60,0.3);
    }

    .container { padding: 15px; max-width: 600px; margin: 0 auto; }

    .section-title {
      font-size: 18px; font-weight: bold; margin: 20px 0 10px 0;
      color: #d35400; border-left: 4px solid #d35400; padding-left: 8px;
    }

    .form-group {
      background: white; padding: 15px; border-radius: 12px;
      margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #e67e22; }

    .menu-item {
      background: white; border-radius: 12px; padding: 15px;
      margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .menu-info { flex-grow: 1; }
    .menu-name { font-size: 16px; font-weight: bold; }
    .menu-price { color: #e67e22; font-weight: bold; margin-top: 4px; }
    .qty-control { display: flex; align-items: center; gap: 10px; }
    .btn-qty {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: #eee; font-size: 18px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-qty:active { background: #ddd; }
    .qty-val { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }

    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; padding: 15px 20px; border-top: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto;
    }
    .total-price { font-size: 20px; font-weight: bold; color: #d35400; }
    .btn-submit {
      background: #e67e22; color: white; border: none;
      padding: 12px 24px; border-radius: 25px; font-size: 16px;
      font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-submit:disabled {
      background: #b0bec5 !important; cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🍗 阿力香雞排 崑山店</h1>
  <p>營業時間：週一至週六 15:00 - 23:00 (週日公休)</p>
</div>

<div class="container">
  <!-- 營業狀態提示橫幅 -->
  <div id="storeStatusNotice" class="status-banner"></div>

  <!-- 顧客資料區 -->
  <div class="form-group">
    <label for="custName">👤 訂購人姓名</label>
    <input type="text" id="custName" placeholder="請輸入姓名">
  </div>
  <div class="form-group">
    <label for="custPhone">📞 聯絡電話</label>
    <input type="tel" id="custPhone" placeholder="請輸入電話號碼">
  </div>
  <div class="form-group">
    <label for="orderRemark">📝 全單備註 / 胡椒辣度需求</label>
    <textarea id="orderRemark" rows="2" placeholder="例：香雞排不要切、大辣、整包胡椒..."></textarea>
  </div>

  <div class="section-title">美味餐點</div>
  <div id="menuContainer">
    <!-- 餐點項目動態產出 -->
  </div>
</div>

<!-- 底部結帳欄 -->
<div class="footer-bar">
  <div>
    <span style="font-size: 13px; color: #777;">合計</span>
    <div class="total-price" id="totalPriceDisplay">$0</div>
  </div>
  <button id="submitOrderBtn" class="btn-submit" onclick="submitOrder()">確認下單</button>
</div>

<script>
  // ⚠️ 請替換為您最即時部署的 GAS 網址與 LIFF ID
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4VN5yr5ZKfD0ko08e3IE7rJLcf1HjSzzWOnxEOKY8DXcO2qeaiSQfCtDj165XhMKgjw/exec";
  const MY_LIFF_ID = "YOUR_LIFF_ID"; // 請填入 LINE Developers 的 LIFF ID

  let userLineUid = "";
  let cart = {};

  // 菜單明細設定
  const menuData = [
    { id: "p1", name: "香雞排(片)", price: 75 },
    { id: "p2", name: "三角骨(份)", price: 50 },
    { id: "p3", name: "魷魚(小)", price: 50 },
    { id: "p4", name: "魷魚(大)", price: 100 },
    { id: "p5", name: "薯條(份)", price: 35 },
    { id: "p6", name: "甜不辣(份)", price: 35 },
    { id: "p7", name: "米血(塊)", price: 15 },
    { id: "p8", name: "豆包(份)", price: 30 }
  ];

  // 初始化 LIFF
  function initLiff() {
    if (MY_LIFF_ID && MY_LIFF_ID !== "YOUR_LIFF_ID") {
      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              userLineUid = profile.userId;
            }).catch(err => console.error(err));
          } else {
            liff.login();
          }
        })
        .catch(err => console.error("LIFF 初始化失敗:", err));
    }
  }

  // 渲染菜單列表
  function renderMenu() {
    const container = document.getElementById('menuContainer');
    let html = '';
    menuData.forEach(item => {
      cart[item.id] = 0;
      html += `
        <div class="menu-item">
          <div class="menu-info">
            <div class="menu-name">${item.name}</div>
            <div class="menu-price">$${item.price}</div>
          </div>
          <div class="qty-control">
            <button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button>
            <span class="qty-val" id="qty-${item.id}">0</span>
            <button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  // 更新餐點數量
  function updateQty(id, delta) {
    cart[id] = Math.max(0, cart[id] + delta);
    document.getElementById(`qty-${id}`).innerText = cart[id];
    calculateTotal();
  }

  // 計算總金額
  function calculateTotal() {
    let total = 0;
    menuData.forEach(item => {
      total += cart[item.id] * item.price;
    });
    document.getElementById('totalPriceDisplay').innerText = `$${total}`;
    return total;
  }

  // 🌟 檢查營業狀態與自動鎖定
  function checkStoreStatus() {
    fetch(GAS_WEB_APP_URL + "?action=checkStatus")
      .then(res => res.json())
      .then(data => {
        const btn = document.getElementById('submitOrderBtn');
        const notice = document.getElementById('storeStatusNotice');

        if (!data.isOpen) {
          btn.disabled = true;
          btn.innerText = `【${data.reason}】暫停點餐`;
          notice.style.display = "block";
          notice.innerText = `🚫 本店目前【${data.reason}】\n營業時間：週一至週六 15:00 - 23:00`;
        } else {
          btn.disabled = false;
          btn.innerText = "確認下單";
          notice.style.display = "none";
        }
      })
      .catch(err => {
        console.error("無法取得營業狀態:", err);
      });
  }

  // 送出訂單
  function submitOrder() {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const remark = document.getElementById('orderRemark').value.trim();
    const total = calculateTotal();

    if (!name || !phone) {
      alert("請填寫姓名與電話號碼！");
      return;
    }

    if (total === 0) {
      alert("請至少選擇一項餐點！");
      return;
    }

    // 整理餐點字串
    let itemsArr = [];
    menuData.forEach(item => {
      if (cart[item.id] > 0) {
        itemsArr.push(`${item.name} x${cart[item.id]}`);
      }
    });
    const itemsDetail = itemsArr.join("\n");

    const submitBtn = document.getElementById('submitOrderBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "訂單送出中...";

    const payload = {
      action: "createOrder",
      name: name,
      phone: phone,
      remark: remark,
      itemsDetail: itemsDetail,
      totalPrice: total,
      lineUid: userLineUid
    };

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        alert(`🎉 下單成功！您的取餐單號為：#${res.orderNo}`);
        if (typeof liff !== "undefined" && liff.isInClient()) {
          liff.closeWindow();
        } else {
          location.reload();
        }
      } else {
        alert("下單失敗：" + (res.error || "請重試"));
        submitBtn.disabled = false;
        submitBtn.innerText = "確認下單";
      }
    })
    .catch(err => {
      alert("連線失敗，請稍後再試！");
      submitBtn.disabled = false;
      submitBtn.innerText = "確認下單";
    });
  }

  // 頁面初始化
  window.onload = function() {
    renderMenu();
    initLiff();
    checkStoreStatus();
  };
</script>

</body>
</html>
