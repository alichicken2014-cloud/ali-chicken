<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿力香雞排 崑山店 - 線上點餐</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      margin: 0; padding: 0;
      color: #333;
      padding-bottom: 120px;
    }
    .header {
      background: linear-gradient(135deg, #e67e22, #d35400);
      color: white; padding: 20px 15px; text-align: center;
      border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9; }

    .status-banner {
      background-color: #e74c3c; color: white;
      text-align: center; padding: 12px 15px;
      font-size: 15px; font-weight: bold;
      display: none; border-radius: 8px; margin: 15px;
      box-shadow: 0 2px 6px rgba(231,76,60,0.3);
    }

    .container { padding: 15px; max-width: 600px; margin: 0 auto; }

    /* 分類標題 */
    .category-title {
      font-size: 18px; font-weight: bold; margin: 20px 0 10px 0;
      color: #d35400; border-left: 4px solid #d35400; padding-left: 8px;
    }

    .form-group {
      background: white; padding: 15px; border-radius: 12px;
      margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; outline: none;
    }

    /* 雞排專屬處理選單 (預設隱藏) */
    #chickenCutGroup {
      display: none;
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      animation: fadeIn 0.3s ease-in-out;
    }

    .option-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .option-btn {
      padding: 6px 12px; border: 1px solid #ccc; border-radius: 16px;
      font-size: 13px; background: #fff; cursor: pointer; user-select: none;
    }
    .option-btn input { display: none; }
    .option-btn.active {
      background: #e67e22; color: white; border-color: #d35400; font-weight: bold;
    }

    .menu-item {
      background: white; border-radius: 12px; padding: 15px;
      margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .menu-info { flex-grow: 1; }
    .menu-name { font-size: 16px; font-weight: bold; }
    .menu-price { color: #e67e22; font-weight: bold; margin-top: 4px; }
    .qty-control { display: flex; align-items: center; gap: 10px; }
    .btn-qty {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: #eee; font-size: 18px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-val { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }

    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; padding: 15px 20px; border-top: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto;
    }
    .total-price { font-size: 20px; font-weight: bold; color: #d35400; }
    .btn-submit {
      background: #e67e22; color: white; border: none;
      padding: 12px 24px; border-radius: 25px; font-size: 16px;
      font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-submit:disabled { background: #b0bec5 !important; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="header">
  <h1>🍗 阿力香雞排 崑山店</h1>
  <p>營業時間：週一至週六 15:00 - 23:00 (週日公休)</p>
</div>

<div class="container">
  <!-- 營業狀態提示橫幅 -->
  <div id="storeStatusNotice" class="status-banner"></div>

  <!-- 顧客資料 -->
  <div class="form-group">
    <label for="custName">👤 訂購人姓名</label>
    <input type="text" id="custName" placeholder="請輸入姓名">
  </div>
  <div class="form-group">
    <label for="custPhone">📞 聯絡電話</label>
    <input type="tel" id="custPhone" placeholder="請輸入電話號碼">
  </div>

  <!-- 🐔 點雞排時才會出現的切法設定 -->
  <div class="form-group" id="chickenCutGroup">
    <label style="color: #d35400;">🍗 雞排切法處理</label>
    <div class="option-group">
      <label class="option-btn active"><input type="radio" name="cut" value="不切" checked onclick="selectOption(this)">不切</label>
      <label class="option-btn"><input type="radio" name="cut" value="要切" onclick="selectOption(this)">要切</label>
    </div>
  </div>

  <!-- 🌶️ 全單調味選擇 -->
  <div class="form-group">
    <label>🧂 全單胡椒 / 辣度需求</label>
    <div class="option-group">
      <label class="option-btn active"><input type="radio" name="spice" value="胡椒" checked onclick="selectOption(this)">胡椒</label>
      <label class="option-btn"><input type="radio" name="spice" value="不加胡椒" onclick="selectOption(this)">不加胡椒</label>
      <label class="option-btn"><input type="radio" name="spice" value="微辣" onclick="selectOption(this)">微辣</label>
      <label class="option-btn"><input type="radio" name="spice" value="小辣" onclick="selectOption(this)">小辣</label>
      <label class="option-btn"><input type="radio" name="spice" value="中辣" onclick="selectOption(this)">中辣</label>
      <label class="option-btn"><input type="radio" name="spice" value="大辣" onclick="selectOption(this)">大辣</label>
    </div>

    <label style="margin-top: 12px;">🌿 九層塔需求</label>
    <div class="option-group">
      <label class="option-btn active"><input type="radio" name="basil" value="要九層塔" checked onclick="selectOption(this)">要九層塔</label>
      <label class="option-btn"><input type="radio" name="basil" value="不要九層塔" onclick="selectOption(this)">不要九層塔</label>
    </div>
  </div>

  <div class="form-group">
    <label for="orderRemark">📝 特別備註</label>
    <textarea id="orderRemark" rows="2" placeholder="例：炸酥一點、醬多..."></textarea>
  </div>

  <!-- 菜單區域 (根據 Sheet 分類動態產出) -->
  <div id="menuContainer">
    <div style="text-align: center; color: #888; padding: 30px;">正在載入最新菜單...</div>
  </div>
</div>

<!-- 底部結帳欄 -->
<div class="footer-bar">
  <div>
    <span style="font-size: 13px; color: #777;">合計</span>
    <div class="total-price" id="totalPriceDisplay">$0</div>
  </div>
  <button id="submitOrderBtn" class="btn-submit" onclick="submitOrder()">確認下單</button>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4VN5yr5ZKfD0ko08e3IE7rJLcf1HjSzzWOnxEOKY8DXcO2qeaiSQfCtDj165XhMKgjw/exec";
  const MY_LIFF_ID = "YOUR_LIFF_ID"; 

  let userLineUid = "";
  let menuData = [];
  let cart = {};

  function initLiff() {
    if (MY_LIFF_ID && MY_LIFF_ID !== "YOUR_LIFF_ID") {
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(p => { userLineUid = p.userId; });
        } else { liff.login(); }
      }).catch(err => console.error(err));
    }
  }

  // 從 Google Sheet 載入菜單資料
  function fetchMenuData() {
    fetch(GAS_WEB_APP_URL + "?action=getMenu")
      .then(res => res.json())
      .then(data => {
        if (data.success && data.menu) {
          menuData = data.menu;
          renderCategorizedMenu();
        } else {
          document.getElementById('menuContainer').innerHTML = '<div style="text-align:center;color:red;padding:20px;">載入菜單失敗，請刷頁重試</div>';
        }
      })
      .catch(() => {
        document.getElementById('menuContainer').innerHTML = '<div style="text-align:center;color:red;padding:20px;">網路連線失敗</div>';
      });
  }

  // 依照 Sheet 分類渲染菜單
  function renderCategorizedMenu() {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';

    // 將品項按分類歸類
    const categories = {};
    menuData.forEach((item, index) => {
      cart[index] = 0; // 初始化數量
      if (!categories[item.category]) {
        categories[item.category] = [];
      }
      categories[item.category].push({ ...item, index });
    });

    // 渲染每個分類
    for (const catName in categories) {
      let catHtml = `<div class="category-title">${catName}</div>`;
      categories[catName].forEach(item => {
        catHtml += `
          <div class="menu-item">
            <div class="menu-info">
              <div class="menu-name">${item.name}</div>
              <div class="menu-price">$${item.price}</div>
            </div>
            <div class="qty-control">
              <button class="btn-qty" onclick="updateQty(${item.index}, -1)">-</button>
              <span class="qty-val" id="qty-${item.index}">0</span>
              <button class="btn-qty" onclick="updateQty(${item.index}, 1)">+</button>
            </div>
          </div>
        `;
      });
      container.innerHTML += catHtml;
    }
  }

  function selectOption(el) {
    const group = el.closest('.option-group');
    group.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
    el.parentElement.classList.add('active');
  }

  function updateQty(index, delta) {
    cart[index] = Math.max(0, cart[index] + delta);
    document.getElementById(`qty-${index}`).innerText = cart[index];
    
    // 🌟 檢查是否有點雞排，有的話顯示切法選項
    checkChickenCutVisibility();
    calculateTotal();
  }

  // 判定是否點了雞排，控制「切/不切」選單顯示與否
  function checkChickenCutVisibility() {
    let hasChicken = false;
    menuData.forEach((item, idx) => {
      if (item.name.includes("雞排") && cart[idx] > 0) {
        hasChicken = true;
      }
    });
    const cutGroup = document.getElementById('chickenCutGroup');
    cutGroup.style.display = hasChicken ? "block" : "none";
  }

  function calculateTotal() {
    let total = 0;
    menuData.forEach((item, idx) => {
      total += cart[idx] * item.price;
    });
    document.getElementById('totalPriceDisplay').innerText = `$${total}`;
    return total;
  }

  function checkStoreStatus() {
    fetch(GAS_WEB_APP_URL + "?action=checkStatus")
      .then(res => res.json())
      .then(data => {
        const btn = document.getElementById('submitOrderBtn');
        const notice = document.getElementById('storeStatusNotice');

        if (!data.isOpen) {
          btn.disabled = true;
          btn.innerText = `【${data.reason}】暫停點餐`;
          notice.style.display = "block";
          notice.innerText = `🚫 本店目前【${data.reason}】\n營業時間：週一至週六 15:00 - 23:00`;
        } else {
          btn.disabled = false;
          btn.innerText = "確認下單";
          notice.style.display = "none";
        }
      })
      .catch(err => console.error(err));
  }

  function submitOrder() {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const remark = document.getElementById('orderRemark').value.trim();
    const total = calculateTotal();

    if (!name || !phone) {
      alert("請填寫姓名與電話號碼！");
      return;
    }
    if (total === 0) {
      alert("請至少選擇一項餐點！");
      return;
    }

    const spiceVal = document.querySelector('input[name="spice"]:checked').value;
    const basilVal = document.querySelector('input[name="basil"]:checked').value;

    // 檢查是否有點雞排，有的話加上切法
    let cutText = "";
    let hasChicken = false;
    menuData.forEach((item, idx) => {
      if (item.name.includes("雞排") && cart[idx] > 0) {
        hasChicken = true;
      }
    });
    if (hasChicken) {
      const cutVal = document.querySelector('input[name="cut"]:checked').value;
      cutText = `${cutVal}、`;
    }

    let seasoningSummary = `【整包調味】${cutText}${spiceVal}、${basilVal}`;
    let itemsArr = [seasoningSummary];
    
    menuData.forEach((item, idx) => {
      if (cart[idx] > 0) {
        itemsArr.push(`${item.name} x${cart[idx]}`);
      }
    });
    const itemsDetail = itemsArr.join("\n");

    const submitBtn = document.getElementById('submitOrderBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "訂單送出中...";

    const payload = {
      action: "createOrder",
      name: name,
      phone: phone,
      remark: remark,
      itemsDetail: itemsDetail,
      totalPrice: total,
      lineUid: userLineUid
    };

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        alert(`🎉 下單成功！您的取餐單號為：#${res.orderNo}`);
        if (typeof liff !== "undefined" && liff.isInClient()) {
          liff.closeWindow();
        } else {
          location.reload();
        }
      } else {
        alert("下單失敗：" + (res.error || "請重試"));
        submitBtn.disabled = false;
        submitBtn.innerText = "確認下單";
      }
    })
    .catch(err => {
      alert("連線失敗，請稍後再試！");
      submitBtn.disabled = false;
      submitBtn.innerText = "確認下單";
    });
  }

  window.onload = function() {
    fetchMenuData();
    initLiff();
    checkStoreStatus();
  };
</script>

</body>
</html>
