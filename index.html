<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿力香雞排 崑山店 - 線上點餐</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      margin: 0; padding: 0;
      color: #333;
      padding-bottom: 120px;
    }
    .header {
      background: linear-gradient(135deg, #e67e22, #d35400);
      color: white; padding: 20px 15px; text-align: center;
      border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9; }

    .status-banner {
      background-color: #e74c3c; color: white;
      text-align: center; padding: 12px 15px;
      font-size: 15px; font-weight: bold;
      display: none; border-radius: 8px; margin: 15px;
      box-shadow: 0 2px 6px rgba(231,76,60,0.3);
      white-space: pre-wrap;
    }

    .container { padding: 15px; max-width: 600px; margin: 0 auto; }

    .search-box { margin-bottom: 12px; }
    .search-input {
      width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0;
      border-radius: 25px; font-size: 15px; outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: #e67e22; }

    .category-nav {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
      margin-bottom: 15px; scrollbar-width: none;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    
    .cat-tab-btn {
      white-space: nowrap; padding: 8px 16px; border-radius: 20px;
      border: 1px solid #ddd; background: #fff; font-size: 14px;
      color: #555; cursor: pointer; transition: 0.2s; flex-shrink: 0;
    }
    .cat-tab-btn.active {
      background: #e67e22; color: #fff; border-color: #d35400; font-weight: bold;
    }

    .category-title {
      font-size: 18px; font-weight: bold; margin: 20px 0 10px 0;
      color: #d35400; border-left: 4px solid #d35400; padding-left: 8px;
    }

    .form-group {
      background: white; padding: 15px; border-radius: 12px;
      margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; outline: none;
    }

    .menu-item-card {
      background: white; border-radius: 12px; padding: 15px;
      margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.2s ease-in-out;
    }
    .item-header { display: flex; justify-content: space-between; align-items: center; }
    .menu-name { font-size: 16px; font-weight: bold; }
    .menu-price { color: #e67e22; font-weight: bold; margin-top: 4px; }
    .qty-control { display: flex; align-items: center; gap: 10px; }
    .btn-qty {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: #eee; font-size: 18px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-val { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }

    .item-custom-options {
      display: none;
      margin-top: 12px;
      border-top: 1px dashed #eee; background: #fffdf9;
      border-radius: 8px; padding: 10px;
    }
    .sub-option-label { font-size: 13px; font-weight: bold; color: #d35400; margin-bottom: 6px; }

    .option-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .option-btn {
      padding: 5px 11px; border: 1px solid #ccc; border-radius: 14px;
      font-size: 12px; background: #fff; cursor: pointer; user-select: none;
    }
    .option-btn input { display: none; }
    .option-btn.active {
      background: #e67e22; color: white; border-color: #d35400; font-weight: bold;
    }

    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; padding: 15px 20px; border-top: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto;
    }
    .total-price { font-size: 20px; font-weight: bold; color: #d35400; }
    .btn-submit {
      background: #e67e22; color: white; border: none;
      padding: 12px 24px; border-radius: 25px; font-size: 16px;
      font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-submit:disabled { background: #b0bec5 !important; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="header">
  <h1>🍗 阿力香雞排 崑山店</h1>
  <p>營業時間：週一至週六 15:00 - 23:00 (週日公休)</p>
</div>

<div class="container">
  <div id="storeStatusNotice" class="status-banner"></div>

  <div class="form-group">
    <label for="custName">👤 訂購人姓名</label>
    <input type="text" id="custName" placeholder="請輸入姓名">
  </div>
  <div class="form-group">
    <label for="custPhone">📞 聯絡電話</label>
    <input type="tel" id="custPhone" placeholder="請輸入電話號碼">
  </div>

  <!-- 🌶️ 全單預設調味 -->
  <div class="form-group">
    <label>🧂 整包炸物預設辣度 / 胡椒</label>
    <div class="option-group">
      <label class="option-btn active"><input type="radio" name="globalSpice" value="胡椒" checked onclick="selectOption(this)">胡椒</label>
      <label class="option-btn"><input type="radio" name="globalSpice" value="不加胡椒" onclick="selectOption(this)">不加胡椒</label>
      <label class="option-btn"><input type="radio" name="globalSpice" value="小辣" onclick="selectOption(this)">小辣</label>
      <label class="option-btn"><input type="radio" name="globalSpice" value="中辣" onclick="selectOption(this)">中辣</label>
      <label class="option-btn"><input type="radio" name="globalSpice" value="大辣" onclick="selectOption(this)">大辣</label>
    </div>

    <label style="margin-top: 10px;">🌿 全單九層塔需求</label>
    <div class="option-group">
      <label class="option-btn active"><input type="radio" name="globalBasil" value="要九層塔" checked onclick="selectOption(this)">要九層塔</label>
      <label class="option-btn"><input type="radio" name="globalBasil" value="不要九層塔" onclick="selectOption(this)">不要九層塔</label>
    </div>
  </div>

  <div class="form-group">
    <label for="orderRemark">📝 特別備註</label>
    <textarea id="orderRemark" rows="2" placeholder="例：炸酥一點、醬多..."></textarea>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋你想吃的餐點..." oninput="handleFilterChange()">
  </div>

  <div class="category-nav" id="categoryNav"></div>

  <div id="menuContainer">
    <div style="text-align: center; color: #888; padding: 30px;">正在載入最新菜單...</div>
  </div>
</div>

<div class="footer-bar">
  <div>
    <span style="font-size: 13px; color: #777;">合計</span>
    <div class="total-price" id="totalPriceDisplay">$0</div>
  </div>
  <button id="submitOrderBtn" class="btn-submit" onclick="submitOrder()">確認下單</button>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4VN5yr5ZKfD0ko08e3IE7rJLcf1HjSzzWOnxEOKY8DXcO2qeaiSQfCtDj165XhMKgjw/exec";
  const MY_LIFF_ID = "2011276802-mdrsLFND"; // 已為您設定好的 LIFF ID

  let userLineUid = "";
  let menuData = [];
  let cart = {};
  let currentCategory = "全部";

  // LIFF 初始化
  async function initLiff() {
    const submitBtn = document.getElementById('submitOrderBtn');

    if (typeof liff === "undefined") {
      console.error("LIFF SDK 未載入");
      return;
    }

    try {
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "驗證身份中...";
      }

      await liff.init({ liffId: MY_LIFF_ID });

      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        userLineUid = profile.userId;
        console.log("✅ 成功取得 LINE UID:", userLineUid);
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("❌ LIFF 初始化失敗:", err);
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = "確認下單";
      }
    }
  }

  function fetchMenuData() {
    fetch(GAS_WEB_APP_URL + "?action=getMenu")
      .then(res => res.json())
      .then(data => {
        if (data.success && data.menu) {
          menuData = data.menu;
          buildCategoryTabs();
          renderFilteredMenu();
        } else {
          document.getElementById('menuContainer').innerHTML = '<div style="text-align:center;color:red;padding:20px;">載入菜單失敗，請重新整理</div>';
        }
      })
      .catch(err => {
        console.error("Fetch Menu Error:", err);
        document.getElementById('menuContainer').innerHTML = '<div style="text-align:center;color:red;padding:20px;">網路連線失敗，請檢查網路</div>';
      });
  }

  function buildCategoryTabs() {
    const nav = document.getElementById('categoryNav');
    const categories = ["全部"];

    menuData.forEach(item => {
      if (item.category && !categories.includes(item.category)) {
        categories.push(item.category);
      }
    });

    let navHtml = '';
    categories.forEach(cat => {
      const activeClass = (cat === currentCategory) ? 'active' : '';
      navHtml += `<button class="cat-tab-btn ${activeClass}" onclick="switchCategory('${cat}', this)">${cat}</button>`;
    });
    nav.innerHTML = navHtml;
  }

  function switchCategory(catName, btnEl) {
    currentCategory = catName;
    document.querySelectorAll('.cat-tab-btn').forEach(btn => btn.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    renderFilteredMenu();
  }

  function handleFilterChange() {
    const searchText = document.getElementById('searchInput').value.trim();
    if (searchText !== "") {
      currentCategory = "全部";
      document.querySelectorAll('.cat-tab-btn').forEach((btn, index) => {
        btn.classList.toggle('active', index === 0);
      });
    }
    renderFilteredMenu();
  }

  function renderFilteredMenu() {
    const container = document.getElementById('menuContainer');
    const searchText = document.getElementById('searchInput').value.trim().toLowerCase();
    container.innerHTML = '';

    const filteredItems = [];
    menuData.forEach((item, index) => {
      if (!cart.hasOwnProperty(index)) cart[index] = 0;

      const matchesCat = (currentCategory === "全部") || (item.category === currentCategory);
      const matchesSearch = item.name.toLowerCase().includes(searchText);

      if (matchesCat && matchesSearch) {
        filteredItems.push({ ...item, index });
      }
    });

    if (filteredItems.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#888; padding:30px;">找不到符合的餐點 🙁</div>';
      return;
    }

    const grouped = {};
    filteredItems.forEach(item => {
      const cat = item.category || "其他";
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(item);
    });

    for (const catName in grouped) {
      let catHtml = `<div class="category-title">${catName}</div>`;
      grouped[catName].forEach(item => {
        const isChicken = item.name.includes("雞排");
        const isFries = item.name.includes("薯條");
        const count = cart[item.index];
        const isShowOptions = count > 0 && (isChicken || isFries);

        catHtml += `
          <div class="menu-item-card" id="card-${item.index}">
            <div class="item-header">
              <div class="menu-info">
                <div class="menu-name">${item.name}</div>
                <div class="menu-price">$${item.price}</div>
              </div>
              <div class="qty-control">
                <button class="btn-qty" onclick="updateQty(${item.index}, -1)">-</button>
                <span class="qty-val" id="qty-${item.index}">${count}</span>
                <button class="btn-qty" onclick="updateQty(${item.index}, 1)">+</button>
              </div>
            </div>

            <div class="item-custom-options" id="custom-${item.index}" style="display: ${isShowOptions ? 'block' : 'none'};">
              ${renderCustomOptionsHTML(item.index, item.name)}
            </div>
          </div>
        `;
      });
      container.innerHTML += catHtml;
    }
  }

  function renderCustomOptionsHTML(idx, name) {
    if (name.includes("雞排")) {
      return `
        <div class="sub-option-label">🍗 雞排切法：</div>
        <div class="option-group">
          <label class="option-btn active"><input type="radio" name="cut-${idx}" value="不切" checked onclick="selectOption(this)">不切</label>
          <label class="option-btn"><input type="radio" name="cut-${idx}" value="要切" onclick="selectOption(this)">要切</label>
        </div>
        <div class="sub-option-label">🧂 雞排調味：</div>
        <div class="option-group">
          <label class="option-btn active"><input type="radio" name="spice-${idx}" value="胡椒" checked onclick="selectOption(this)">胡椒</label>
          <label class="option-btn"><input type="radio" name="spice-${idx}" value="甘梅" onclick="selectOption(this)">甘梅</label>
          <label class="option-btn"><input type="radio" name="spice-${idx}" value="不加胡椒" onclick="selectOption(this)">不加胡椒</label>
          <label class="option-btn"><input type="radio" name="spice-${idx}" value="小辣" onclick="selectOption(this)">小辣</label>
          <label class="option-btn"><input type="radio" name="spice-${idx}" value="中辣" onclick="selectOption(this)">中辣</label>
          <label class="option-btn"><input type="radio" name="spice-${idx}" value="大辣" onclick="selectOption(this)">大辣</label>
        </div>
      `;
    } else if (name.includes("薯條")) {
      return `
        <div class="sub-option-label">🍟 薯條調味：</div>
        <div class="option-group">
          <label class="option-btn active"><input type="radio" name="friesFlavor-${idx}" value="胡椒" checked onclick="selectOption(this)">胡椒</label>
          <label class="option-btn"><input type="radio" name="friesFlavor-${idx}" value="甘梅" onclick="selectOption(this)">甘梅</label>
          <label class="option-btn"><input type="radio" name="friesFlavor-${idx}" value="原味(不加)" onclick="selectOption(this)">原味(不加)</label>
          <label class="option-btn"><input type="radio" name="friesFlavor-${idx}" value="隨整包" onclick="selectOption(this)">隨整包</label>
        </div>
      `;
    }
    return '';
  }

  function selectOption(el) {
    const group = el.closest('.option-group');
    group.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
    el.parentElement.classList.add('active');
  }

  function updateQty(index, delta) {
    cart[index] = Math.max(0, cart[index] + delta);
    const qtyEl = document.getElementById(`qty-${index}`);
    if (qtyEl) qtyEl.innerText = cart[index];

    const item = menuData[index];
    const customDiv = document.getElementById(`custom-${index}`);
    
    if (customDiv && (item.name.includes("雞排") || item.name.includes("薯條"))) {
      customDiv.style.display = cart[index] > 0 ? "block" : "none";
    }

    calculateTotal();
  }

  function calculateTotal() {
    let total = 0;
    menuData.forEach((item, idx) => {
      total += (cart[idx] || 0) * item.price;
    });
    document.getElementById('totalPriceDisplay').innerText = `$${total}`;
    return total;
  }

  function checkStoreStatus() {
    fetch(GAS_WEB_APP_URL + "?action=checkStatus")
      .then(res => res.json())
      .then(data => {
        const btn = document.getElementById('submitOrderBtn');
        const notice = document.getElementById('storeStatusNotice');

        if (!data.isOpen) {
          btn.disabled = true;
          btn.innerText = `【${data.reason}】暫停點餐`;
          notice.style.display = "block";
          notice.innerText = `🚫 本店目前【${data.reason}】\n營業時間：週一至週六 15:00 - 23:00`;
        } else {
          btn.disabled = false;
          btn.innerText = "確認下單";
          notice.style.display = "none";
        }
      })
      .catch(err => console.error("Check Status Error:", err));
  }

  function submitOrder() {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const remark = document.getElementById('orderRemark').value.trim();
    const total = calculateTotal();

    if (!name || !phone) {
      alert("請填寫姓名與電話號碼！");
      return;
    }
    if (total === 0) {
      alert("請至少選擇一項餐點！");
      return;
    }

    if (!userLineUid) {
      alert("尚未成功驗證 LINE 帳號，請重新關閉開啟此頁面！");
      return;
    }

    const globalSpiceEl = document.querySelector('input[name="globalSpice"]:checked');
    const globalBasilEl = document.querySelector('input[name="globalBasil"]:checked');
    
    const globalSpice = globalSpiceEl ? globalSpiceEl.value : "胡椒";
    const globalBasil = globalBasilEl ? globalBasilEl.value : "要九層塔";

    let itemsArr = [`【全單需求】${globalSpice}、${globalBasil}`];

    menuData.forEach((item, idx) => {
      const count = cart[idx];
      if (count > 0) {
        let itemDetailStr = `${item.name} x${count}`;
        
        if (item.name.includes("雞排")) {
          const cutEl = document.querySelector(`input[name="cut-${idx}"]:checked`);
          const spiceEl = document.querySelector(`input[name="spice-${idx}"]:checked`);
          const cutVal = cutEl ? cutEl.value : "不切";
          const spiceVal = spiceEl ? spiceVal.value : "胡椒";
          itemDetailStr += ` (${cutVal}、${spiceVal})`;
        }
        
        if (item.name.includes("薯條")) {
          const flavorEl = document.querySelector(`input[name="friesFlavor-${idx}"]:checked`);
          const flavorVal = flavorEl ? flavorEl.value : "胡椒";
          itemDetailStr += ` (${flavorVal})`;
        }

        itemsArr.push(itemDetailStr);
      }
    });

    const itemsDetail = itemsArr.join("\n");

    const submitBtn = document.getElementById('submitOrderBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "訂單送出中...";

    const payload = {
      action: "createOrder",
      name: name,
      phone: phone,
      remark: remark,
      itemsDetail: itemsDetail,
      totalPrice: total,
      lineUid: userLineUid
    };

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        alert(`🎉 下單成功！您的取餐單號為：#${res.orderNo}`);
        if (typeof liff !== "undefined" && liff.isInClient()) {
          liff.closeWindow();
        } else {
          location.reload();
        }
      } else {
        alert("下單失敗：" + (res.error || "請重試"));
        submitBtn.disabled = false;
        submitBtn.innerText = "確認下單";
      }
    })
    .catch(err => {
      console.error("Submit Order Error:", err);
      alert("連線失敗，請稍後再試！");
      submitBtn.disabled = false;
      submitBtn.innerText = "確認下單";
    });
  }

  window.onload = function() {
    initLiff();
    fetchMenuData();
    checkStoreStatus();
  };
</script>

</body>
</html>
